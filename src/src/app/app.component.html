@if (isLoggedIn) {
  <!-- Sidebar -->
  <aside class="fixed left-0 top-0 h-full w-[280px] flex flex-col z-50 overflow-y-auto bg-ucc-secondary shadow-xl transition-all duration-300">
    <div class="p-gutter pb-8 flex flex-col gap-1">
      <h1 class="text-2xl font-bold text-white">Perfiles Tecnológicos</h1>
      <p class="text-xs text-white/60 uppercase tracking-widest">Sistema Administrativo</p>
    </div>
    <nav class="flex-1 flex flex-col overflow-y-auto px-2">
      <a [routerLink]="['/catalogos']" routerLinkActive="bg-ucc-primary-container/20 border-l-4 border-ucc-primary-container text-white" class="flex items-center gap-4 text-white/70 hover:text-white hover:bg-ucc-neutral-outline/10 py-3 px-6 transition-all rounded-lg">
        <span class="material-symbols-outlined">folder_shared</span>
        <span class="text-sm font-semibold">Catálogos Base</span>
      </a>
      @for (item of filteredMenu$ | async; track item.pantallaId) {
        <a [routerLink]="[item.link]" routerLinkActive="bg-ucc-primary-container/20 border-l-4 border-ucc-primary-container text-white" class="flex items-center gap-4 text-white/70 hover:text-white hover:bg-ucc-neutral-outline/10 py-3 px-6 transition-all rounded-lg">
          <span class="material-symbols-outlined">{{item.icon}}</span>
          <span class="text-sm font-semibold">{{item.label}}</span>
        </a>
      }
    </nav>
    <div class="mt-auto border-t border-white/10 p-4 flex flex-col gap-2">
      <button (click)="logout()" class="w-full flex items-center gap-4 text-white/70 hover:text-ucc-error hover:bg-ucc-error/10 py-2 px-4 transition-colors rounded-lg">
        <span class="material-symbols-outlined">logout</span>
        <span class="text-sm font-semibold">Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <!-- Header -->
  <header class="fixed top-0 right-0 left-[280px] h-16 flex justify-between items-center px-gutter z-40 bg-ucc-surface border-b border-ucc-neutral-outline/30 shadow-sm">
    <div class="flex items-center flex-1 max-w-xl">
      <div class="relative w-full">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-ucc-neutral-variant">search</span>
        <input class="w-full bg-ucc-background border-none rounded-full pl-10 pr-4 py-2 focus:ring-2 focus:ring-ucc-primary-container text-sm transition-all outline-none" placeholder="Buscar..." type="text"/>
      </div>
    </div>
    <div class="flex items-center gap-6">
      <div class="flex items-center gap-3">
        <div class="text-right">
          <p class="text-sm font-bold text-ucc-secondary leading-none">Admin Usuario</p>
          <p class="text-[10px] text-ucc-neutral-variant uppercase">Global Admin</p>
        </div>
        <div class="w-10 h-10 rounded-full border-2 border-ucc-primary-container bg-ucc-primary flex items-center justify-center text-white">
          <span class="material-symbols-outlined">person</span>
        </div>
      </div>
    </div>
  </header>
}

<!-- Main Content -->
<main [ngClass]="isLoggedIn ? 'ml-[280px] pt-24 px-md pb-md' : ''">
  <router-outlet></router-outlet>
</main>
